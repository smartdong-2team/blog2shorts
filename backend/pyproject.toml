[project]
name = "blog2shorts-backend"
version = "0.1.0"
description = "Blog to Shorts API server (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pytest-asyncio>=1.4.1.post1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
